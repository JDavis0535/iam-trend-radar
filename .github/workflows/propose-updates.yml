# Weekly: asks Claude to propose edits to the curated trends and recommendations from the recent feed, and opens a
# pull request with them. A second, independent model call then checks every edit against its cited headlines. If all
# pass and none changes maturity or momentum, the PR merges and deploys by itself; otherwise it waits for a person.
# Needs the repository secret ANTHROPIC_API_KEY, and Settings > Actions > General > "Allow GitHub Actions to create
# and approve pull requests". Without the secret the run does nothing and succeeds.
name: Propose content updates

on:
  schedule:
    - cron: '41 7 * * 1'   # Mondays 07:41 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write   # to start the deploy after an automatic merge

concurrency:
  group: propose-updates
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Look for an open proposal PR
        id: open
        run: echo "count=$(gh pr list --label auto-content --state open --json number --jq length)" >> "$GITHUB_OUTPUT"

      - name: Refresh feed and signals
        if: steps.open.outputs.count == '0'
        run: |
          node scripts/fetch-feed.mjs
          node scripts/build-signals.mjs

      - name: Install the proposal job's dependencies
        if: steps.open.outputs.count == '0'
        run: npm ci --prefix scripts/propose

      - name: Ask Claude for proposals (guard rails decide what is applied)
        id: propose
        if: steps.open.outputs.count == '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IAM_AUTOMERGE: ${{ vars.IAM_AUTOMERGE }}
        run: node scripts/propose/propose-updates.mjs --body-file "$RUNNER_TEMP/pr-body.md"

      - name: Rebuild generated files and run tests
        if: steps.propose.outputs.applied != '' && steps.propose.outputs.applied != '0'
        run: |
          node scripts/build-data.mjs
          node --test

      - name: Open the pull request
        id: pr
        if: steps.propose.outputs.applied != '' && steps.propose.outputs.applied != '0'
        run: |
          branch="auto/content-update-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          # Only curated content and its generated bundles. The refreshed feed and signals are never committed.
          git add data/trends.json data/recommendations.json data/meta.json data/data.js dist/app.js
          git commit -m "Weekly content update proposed from the feed (needs review)"
          git push origin "$branch"
          gh label create auto-content --color 5319e7 --description "Automated content proposal" 2>/dev/null || true
          gh pr create --base main --head "$branch" --label auto-content \
            --title "Weekly content update" --body-file "$RUNNER_TEMP/pr-body.md"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # Only when the independent check approved every edit and none changes maturity or momentum. Anything else
      # stays open for a person. Set the repository variable IAM_AUTOMERGE to false to switch this step off.
      - name: Merge and publish (automated check passed)
        if: steps.propose.outputs.automerge == 'true' && vars.IAM_AUTOMERGE != 'false'
        run: |
          gh pr merge "${{ steps.pr.outputs.branch }}" --squash --delete-branch
          # A merge made with GITHUB_TOKEN does not trigger the push-based deploy, so start it explicitly.
          gh workflow run "Publish site"
